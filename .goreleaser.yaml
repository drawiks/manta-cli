version: 2

project_name: manta-cli

before:
  hooks:
    - go mod verify

builds:
  - id: manta-cli
    main: .
    binary: manta-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/drawiks/manta-cli/internal/version.Version={{ .Version }}
      - -X github.com/drawiks/manta-cli/internal/version.Commit={{ .Commit }}
      - -X github.com/drawiks/manta-cli/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers:
  - image_templates: ["ghcr.io/drawiks/manta-cli:{{ .Tag }}-amd64"]
    use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
  - image_templates: ["ghcr.io/drawiks/manta-cli:{{ .Tag }}-arm64"]
    use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: ghcr.io/drawiks/manta-cli:{{ .Tag }}
    image_templates:
      - ghcr.io/drawiks/manta-cli:{{ .Tag }}-amd64
      - ghcr.io/drawiks/manta-cli:{{ .Tag }}-arm64
  - name_template: ghcr.io/drawiks/manta-cli:latest
    image_templates:
      - ghcr.io/drawiks/manta-cli:{{ .Tag }}-amd64
      - ghcr.io/drawiks/manta-cli:{{ .Tag }}-arm64
